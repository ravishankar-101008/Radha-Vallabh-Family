<!DOCTYPE html>
<html lang="en">
<head>
    <title>Flexbox Direction</title>

    <style>
    .container {
            height: 40px;
            padding: 20px;
            border: 3px solid black;

            display: flex;
            justify-content: space-between;
        }

        .box1 {
            background-color: aqua;
        }

        .box2 {
            background-color: blueviolet;
        }

        .box3 {
            background-color: yellow;
        }

        .box4 {
            background-color: rgb(27, 99, 181);
        }
    </style>
</head>

<body>

    <h1>Flex Container</h1>

    <div class="container">
        <div class="box1" class="box">Flex Item 1</div>
        <div class="box2" class="box">Flex Item 2</div>
        <div class="box3" class="box">Flex Item 3</div>
        <div class="box4" class="box">Flex Item 4</div>
    </div>

</body>
</html>
