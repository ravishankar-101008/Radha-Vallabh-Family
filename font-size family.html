<!DOCTYPE html>
<html lang="en">
<head>
    <title>line-height</title>
    <style>
        #first {font-size:5px;}
        #second {font-size:20px;}
        #third {font-size:40px;}
        #fourth {font-size:60px;}
    </style>
    </style>
</head>

    <p id="third">This is yet another paragraph with a different line height.</p
    
</body>
</html>
