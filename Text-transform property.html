<!DOCTYPE html>
<html lang="en">
<head>
    <title>text transform property</title>
    <style>
        #box1 {text-transform: uppercase; background-color: red;}
        #box2 {text-transform: lowercase; background-color: green;}
        #box3 {text-transform: capitalize; background-color: yellow;}
        #box4 {text-transform: none; background-color: pink;}
    </style>
</head>
<body>
    <h3 id="box1" class="box">first box</h3>
    <h3 id="box2" class="box">second box</h3>
    <h3 id="box3" class="box">third box</h3>
    <h4 id="box4" class="box">fourth box</h4>
    
</body>
</html>
