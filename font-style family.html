<!DOCTYPE html>
<html lang="en">
<head>
    <title>font-weight</title>
    <style>
        #first {font-style:italic;}
        #second {font-style:oblique;}
        #third {font-style:normal;}
    </style>
</head>
<body>
    <p id="first">This is a paragraph with normal font weight.</p>
    <p id="second">This is a paragraph with bold font weight.</p>
    <p id="third">This is a paragraph with bolder font weight.</p>
    <p id="fourth">This is a paragraph with lighter font weight.</p>
</body>
</html>
