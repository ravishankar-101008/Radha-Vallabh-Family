<!DOCTYPE html>
<html lang="en">
<head>
    <title>Float property</title>
    <style>
        .container{
            height: 110px;
            width: 300px;
            border: 5px solid rgb(184, 209, 41);
        }
        .box{
            width: 100px;
            height: 100px;
            margin: 5px;
        }
        .box1{
            background-color: rgb(205, 50, 174);
            float: right;
        }
        .box2{
            background-color: goldenrod;
            float:left
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box box1"></div>
        <div class="box box2"></div>
    </div>
    
</body>
</html>
