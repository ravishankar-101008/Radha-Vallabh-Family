
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Media Queries(width)</title>
    <style>
        .item1 {
            height: 100px;
            width: 100px;
            background-color: aquamarine;
        }

        @media screen and (width: 250px) {
            .box {
                border: 5px solid red;
            }
        }
    </style>
</head>
<body>


    <div class="container">
        <div class="item1">item1</div>
        <div class="item1">item2</div>
        <div class="item3">item3</div>
        <div class="item4">item4</div>
    </div>
</body>
</html>
