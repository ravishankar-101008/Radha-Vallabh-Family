<!DOCTYPE html>
<html lang="en">
<head>
    <title>Relative Unit (em)</title>
    <style>
        body{
            font-size: 150px;}
        #first{
            height: 200px;
            width:  200px;
            background-color: aqua;
            font-size: 25px;

        }
        #second{
            height: 50%;
            width:70%;
            height: 50%;
            font-size: 2em;
            background-color: aquamarine;
        }
    </style>
</head>
<body>

    <div id="first">
        first
        <div id="second">
            second
        </div>
    </div>

</body>
</html>
