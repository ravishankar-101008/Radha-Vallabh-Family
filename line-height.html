<!DOCTYPE html>
<html lang="en">
<head>
    <title>line-height</title>
    <style>
        #first{line-height: 6px;}
        #second{line-height: 20px;}
        #third{line-height: 40px;}
    </style>
</head>
<body>
    <p id="first">This is a paragraph with a specified line height.</p><br>
    <p id="second">This is another paragraph with a different line height.</p><br>
    <p id="third">This is yet another paragraph with a different line height.</p
    
</body>
</html>
