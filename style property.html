<!DOCTYPE html>
<html lang="en">
<head>
    <title>text decoration property</title>
    <style>
        .box{text-decoration: underline;}
        #box1(text-decoration-style: dashed;)
        #box2{text-decoration-style: dotted; text-decoration-color: green;}
        #box3{text-decoration-style: double; text-decoration-color: blue;}
        #box4{text-decoration-style: solid; text-decoration-color: red;}
    </style>
</head>
<body>
    <h3 id="box1" class="box">Box1 </h3>
    <h3 id="box2" class="box">Box2 </h3>
    <h3 id="box3" class="box">Box3 </h3>
    <h4 id="box4" class="box">Box4 </h4>

    
</body>
</html>
