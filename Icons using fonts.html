<!DOCTYPE html>
<html lang="en">
<head>
    <title>icons</title>
    <script src="https://kit.fontawesome.com/43290fa92d.js"
    crossorigin="anonymous">



</script>
<style>
    #telegram{
        font-size: 150px;
        text-align: center;
        position: relative;
        color: rgb(23, 161, 102);
    }
    #github{
        font-size: 250px;
        text-align: center;
        position: relative;
        color: black;
    }
    #linkedin{
        font-size: 340px;
        text-align: center;
        position: relative;
        color: blue;
    }
    #instagram{
        font-size: 430px;
        text-align: center;
        position: relative;
        top: 90px;
        color: red;
    }
</style>
</head>
<body>
    <i id="telegram" class="fa-brands fa-telegram"></i>
    <i id="github" class="fa-brands fa-github"></i>
    <i id="linkedin" class="fa-brands fa-linkedin"></i>
    <i id="instagram" class="fa-brands fa-square-instagram"></i>
    
</body>
</html>
