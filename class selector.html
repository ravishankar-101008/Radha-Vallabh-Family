<!DOCTYPE html>
<html lang="en">
<head>
    <title>class selector</title>
    <style>
        #first {
            color: red;
            font-size: 50px;
            margin: 20px;
            padding: 20px;
            text-align: center;
        }
        .second {
            color: blue;
            font-size: 50px;
            margin: 20px;
            padding: 20px;
            text-align: center;
        }
    </style>

</head>
<body>
  <div id="first">premanand ji maharaj</div>" 
  <div class="second">radha vallabh ji</div>
  <div class="second">radha govind ji</div> 
</body>
</html>
