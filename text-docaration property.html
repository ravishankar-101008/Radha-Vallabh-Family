<!DOCTYPE html>
<html lang="en">
<head>
    <title>Text Decoration</title>
    <style>
        #box1{background-color: red; text-decoration: underline;}
        #box2{background-color: green; text-decoration: overline;}
        #box3{background-color: yellow; text-decoration: line-through;}
    </style>

</head>
<body>
    <h3 id="box1" class="box">Box1 </h3>
    <h3 id="box2" class="box">Box2 </h3>
    <h3 id="box3" class="box">Box3 </h3>
    <a href="https://www.google.com">Google</a><br>
    <a href="https://www.facebook.com">Facebook</a><br>
    <a href="https://www.instagram.com">Instagram</a><br>
    
</body>
</html>
